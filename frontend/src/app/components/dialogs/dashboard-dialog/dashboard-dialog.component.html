<button class="close" (click)="close()" aria-label="Fechar dashboard">×</button>
<span class="kicker">OPERAÇÃO</span>
<h2 mat-dialog-title>Dashboard</h2>
<nav class="dashboard-tabs" role="tablist" aria-label="Seções do dashboard">
  <button [class.active]="tab === 'stats'" (click)="tab = 'stats'" role="tab" [attr.aria-selected]="tab === 'stats'">Estatísticas</button>
  <button [class.active]="tab === 'feeds'" (click)="tab = 'feeds'" role="tab" [attr.aria-selected]="tab === 'feeds'">Fontes</button>
  <button [class.active]="tab === 'telemetry'" (click)="tab = 'telemetry'" role="tab" [attr.aria-selected]="tab === 'telemetry'">Telemetria</button>
  <button [class.active]="tab === 'system'" (click)="tab = 'system'" role="tab" [attr.aria-selected]="tab === 'system'">Sistema</button>
</nav>

<div mat-dialog-content>
  @if (tab === 'stats') {
    <app-statistics-panel />
  }

  @if (tab === 'feeds') {
    <app-feed-management />
  }

  @if (tab === 'telemetry') {
    <app-telemetry-panel />
  }
  @if (tab === 'system') {
    <app-system-panel />
  }

</div>
