<!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * -->
<main>
  <header>
    <div><span class="kicker">RSS READER</span><h1>Leituras em movimento.</h1></div>
    <div class="header-actions"><p>{{ totalCount }} histórias visíveis</p><div class="language-tools"><span>Traduzir página</span><div id="google_translate_element"></div></div><button class="dashboard-trigger" (click)="openDashboard()">Dashboard <span aria-hidden="true">↗</span></button></div>
  </header>

  <div class="refresh-status"><span class="pulse"></span>{{ refreshLabel }} <span>·</span> última leitura registrada por fonte</div>

  <section class="toolbar">
    <input [(ngModel)]="search" (keyup.enter)="query()" placeholder="Buscar nas histórias..." />
    <button (click)="query()">Buscar</button>
    <select [(ngModel)]="category" (change)="filtersChanged()" aria-label="Filtrar por categoria">
      @for (item of categories; track item) { <option [value]="item">{{ item }}</option> }
    </select>
    <select [(ngModel)]="feedId" (change)="filtersChanged()" aria-label="Filtrar por fonte">
      <option value="Todas">Todas as fontes</option>
      @for (feed of feeds; track feed.id) { <option [value]="feed.id">{{ feed.name }}</option> }
    </select>
    <select [(ngModel)]="periodHours" (change)="filtersChanged()" aria-label="Filtrar por período">
      <option [ngValue]="24">Últimas 24 horas</option>
      <option [ngValue]="168">Últimos 7 dias</option>
      <option [ngValue]="720">Últimos 30 dias</option>
      <option [ngValue]="0">Qualquer período</option>
    </select>
    <select [(ngModel)]="sort" (change)="filtersChanged()" aria-label="Ordenar notícias">
      <option value="published">Mais recentes por publicação</option>
      <option value="collected">Mais recentes por coleta</option>
    </select>
    <select [(ngModel)]="pageSize" (change)="changePageSize()" aria-label="Quantidade por página">
      @for (size of pageSizes; track size) { <option [ngValue]="size">{{ size }} por página</option> }
      <option [ngValue]="0">Todas</option>
    </select>
    <button class="favorites-filter" [class.active]="favoritesOnly" (click)="favoritesOnly = !favoritesOnly; filtersChanged()" [attr.aria-pressed]="favoritesOnly">★ Favoritos</button>
  </section>

  <div class="layout">
    <section class="stories">
      <app-article-list
        [articles]="articles"
        [page]="page"
        [totalPages]="totalPages"
        [pageOptions]="pageOptions"
        (selected)="openArticle($event)"
        (favoriteToggled)="toggleFavorite($event)"
        (hidden)="hideArticle($event)"
        (pageChanged)="goToPage($event)" />
    </section>
  </div>
</main>
