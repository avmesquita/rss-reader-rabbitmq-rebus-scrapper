  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'pt-BR',
        includedLanguages: 'de,en,es,fr,it,ja,ko,pt,zh-CN,pt,hi,ru',
        autoDisplay: false
      }, 'google_translate_element');

      const languageKey = 'rss-reader.language.v1';
      const languageHost = document.getElementById('google_translate_element');
      if (!languageHost) return;
      const languageObserver = new MutationObserver(() => {
        const selector = languageHost.querySelector('select.goog-te-combo');
        if (!selector) return;
        languageObserver.disconnect();
        if (selector.dataset.languageStorageBound) return;
        selector.dataset.languageStorageBound = 'true';
        selector.addEventListener('change', () => {
          try {
            if (selector.value) localStorage.setItem(languageKey, selector.value);
            else localStorage.removeItem(languageKey);
          } catch { /* Translation still works when storage is unavailable. */ }
        });
        try {
          const savedLanguage = localStorage.getItem(languageKey);
          if (savedLanguage && Array.from(selector.options).some(option => option.value === savedLanguage)) {
            selector.value = savedLanguage;
            selector.dispatchEvent(new Event('change'));
          }
        } catch { /* Translation still works when storage is unavailable. */ }
      });
      languageObserver.observe(languageHost, { childList: true, subtree: true });
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
